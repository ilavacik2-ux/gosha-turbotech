# ==============================================================================
# GOSHATURBOTECH — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Размещение: /etc/nginx/sites-available/goshaturbotech.conf
# Активация: ln -s /etc/nginx/sites-available/goshaturbotech.conf /etc/nginx/sites-enabled/
# Тестирование: nginx -t && systemctl reload nginx
# ==============================================================================

# 1. Лимиты запросов на уровне Nginx (защита от DDoS и спам-запросов)
limit_req_zone $binary_remote_addr zone=gtt_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=gtt_api:10m rate=10r/s;

# 2. Пул бэкенда Uvicorn (FastAPI)
upstream gtt_uvicorn_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 3. Редирект HTTP -> HTTPS (порт 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name goshaturbotech.ru www.goshaturbotech.ru;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. Основной защищенный HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goshaturbotech.ru www.goshaturbotech.ru;

    # Путь к корню проекта (укажите реальный путь на вашем сервере)
    root /var/www/goshaturbotech;
    index index.html;

    # SSL Сертификаты (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/goshaturbotech.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goshaturbotech.ru/privkey.pem;

    # Современные безопасные параметры TLS (Mozilla Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Максимальный размер загрузки (для загрузки фото и видео в админке)
    client_max_body_size 50M;

    # Оптимизация TCP и статики
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # GZIP сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ================= ЗАЩИТА СИСТЕМНЫХ ФАЙЛОВ =================
    # Блокировка доступа к .env, .git, SQLite, логам и бэкапам
    location ~* (/\.|\.sqlite|\.db|\.env|\.log|\.bak|\.sh)$ {
        deny all;
        return 404;
    }

    # ================= КЭШИРОВАНИЕ И СТАТИКА =================
    # Статические ассеты (CSS, JS, WebP, SVG, WOFF2)
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Стриминг видео MP4 (с поддержкой Range-запросов для Safari и мобильных)
    location ~* \.(mp4|webm)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ================= API И ДИНАМИЧЕСКИЙ ПРОКСИ =================
    # Все API-запросы проксируются в локальный Uvicorn (127.0.0.1:8000)
    location /api/ {
        limit_req zone=gtt_api burst=20 nodelay;

        proxy_pass http://gtt_uvicorn_backend;
        proxy_http_version 1.1;

        # Проброс реального IP клиента для rate-limiter'а и аудита
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Таймауты ожидания ответа
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Скрытая админ-панель (проксируется в FastAPI для проверки токена шлюза)
    location = /admin {
        limit_req zone=gtt_api burst=10 nodelay;

        proxy_pass http://gtt_uvicorn_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Главная страница и fallback
    location / {
        limit_req zone=gtt_general burst=50 nodelay;

        # Сначала отдаем статический файл, если нет — проксируем в Uvicorn
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://gtt_uvicorn_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
