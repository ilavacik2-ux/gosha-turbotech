# ==============================================================================
# GOSHATURBOTECH — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Размещение: /etc/nginx/sites-available/goshaturbotech.conf
# Активация: ln -s /etc/nginx/sites-available/goshaturbotech.conf /etc/nginx/sites-enabled/
# Тестирование: nginx -t && systemctl reload nginx
# ==============================================================================

log_format gtt_without_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

limit_req_zone $binary_remote_addr zone=gtt_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=gtt_api:10m rate=10r/s;

upstream gtt_uvicorn_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name goshaturbotech.ru www.goshaturbotech.ru;
    access_log /var/log/nginx/access.log gtt_without_query;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goshaturbotech.ru www.goshaturbotech.ru;
    access_log /var/log/nginx/access.log gtt_without_query;

    root /var/www/goshaturbotech;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/goshaturbotech.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goshaturbotech.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Достаточный лимит для видео до 60 МБ через multipart/form-data
    client_max_body_size 100M;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ================= ЖЁСТКИЙ 404 CLOAKING СЛУЖЕБНЫХ ФАЙЛОВ =================
    location ~* ^/(\.|private_admin|deploy|venv|__pycache__|gtt_config|admin\.html|admine|gtt71|gtt-hub|staff-gate|requirements\.txt) {
        return 404;
    }

    location ~* \.(sqlite|sqlite3|db|db-wal|db-shm|env|py|pyc|log|bak|sh|md|example|yml|yaml)$ {
        return 404;
    }

    # Блокируем любые .json кроме публичных каталогов в /data/
    location ~* ^/(?!data/(cars|team|records|gallery|moto|moto_banners|partners|hero_telemetry)\.json$).*\.json$ {
        return 404;
    }

    # ================= ЗАЩИЩЁННЫЕ АССЕТЫ И ШЛЮЗ АДМИНКИ =================
    location ^~ /_gtt_assets/ {
        proxy_pass http://gtt_uvicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin {
        limit_req zone=gtt_api burst=10 nodelay;
        proxy_pass http://gtt_uvicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================= КЭШИРОВАНИЕ ПУБЛИЧНОЙ СТАТИКИ =================
    location ~* ^/(assets|css|js)/.*\.(css|js|jpg|jpeg|png|webp|svg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.(mp4|webm|m4v|mov)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        access_log off;
        try_files $uri =404;
    }

    # ================= API =================
    location /api/ {
        limit_req zone=gtt_api burst=20 nodelay;
        proxy_pass http://gtt_uvicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        limit_req zone=gtt_general burst=50 nodelay;

        proxy_pass http://gtt_uvicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
