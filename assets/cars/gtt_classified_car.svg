<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0d1118" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Neon Orange Glow -->
    <linearGradient id="orangeNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA5B0C" />
      <stop offset="100%" stop-color="#FF7D29" />
    </linearGradient>

    <!-- Cyan Laser Glow -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
    <pattern id="techDots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="rgba(234, 91, 12, 0.25)" />
    </pattern>

    <!-- Radial Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(234, 91, 12, 0.16)" />
      <stop offset="60%" stop-color="rgba(0, 229, 255, 0.04)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#techGrid)" />
  <rect width="800" height="480" fill="url(#techDots)" />
  <rect width="800" height="480" fill="url(#centerGlow)" />

  <!-- Corner HUD brackets -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none">
    <path d="M 24 44 L 24 24 L 44 24" />
    <path d="M 776 44 L 776 24 L 756 24" />
    <path d="M 24 436 L 24 456 L 44 456" />
    <path d="M 776 436 L 776 456 L 756 456" />
  </g>

  <!-- Technical Telemetry Header Data -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">
    <text x="32" y="38">GTT // SKUNKWORKS LAB</text>
    <text x="400" y="38" text-anchor="middle" fill="#EA5B0C">STATUS: ARCHIVE &amp; VERIFICATION</text>
    <text x="768" y="38" text-anchor="end">SYS_ID: 71-REG</text>
  </g>

  <!-- Aerodynamic Blueprint Silhouette of Supercar / Drag Monster -->
  <g fill="none" opacity="0.32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground Line -->
    <line x1="120" y1="360" x2="680" y2="360" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Car Body Silhouette Wireframe -->
    <path d="M 150 350 
             L 170 330 
             C 195 295, 230 285, 270 295 
             L 340 300 
             L 420 235 
             C 470 215, 540 215, 595 240 
             L 655 295 
             L 700 310 
             C 715 315, 725 330, 720 345 
             L 715 350 
             Z" 
          stroke="url(#orangeNeon)" stroke-width="1.8" fill="rgba(234,91,12,0.025)"/>

    <!-- GT Wing Drag Spoiler -->
    <path d="M 130 270 L 175 270 L 165 295 L 140 295 Z" stroke="url(#cyanNeon)" stroke-width="1.5"/>
    <line x1="145" y1="295" x2="148" y2="330" stroke="url(#cyanNeon)" stroke-width="1.5"/>
    <line x1="165" y1="295" x2="168" y2="330" stroke="url(#cyanNeon)" stroke-width="1.5"/>

    <!-- Front Splitter & Canards -->
    <path d="M 690 345 L 725 345 L 715 338" stroke="url(#orangeNeon)" stroke-width="1.5"/>

    <!-- Wheels (Billet Beadlocks Wireframe) -->
    <circle cx="230" cy="340" r="38" stroke="url(#cyanNeon)" stroke-width="1.5"/>
    <circle cx="230" cy="340" r="18" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="630" cy="340" r="38" stroke="url(#cyanNeon)" stroke-width="1.5"/>
    <circle cx="630" cy="340" r="18" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Wheel crossbars -->
    <line x1="230" y1="302" x2="230" y2="378" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="192" y1="340" x2="268" y2="340" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="630" y1="302" x2="630" y2="378" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="592" y1="340" x2="668" y2="340" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Aerodynamic Flow Vectors -->
    <path d="M 120 220 Q 300 210 440 190 T 730 270" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 140 200 Q 320 190 460 170 T 740 250" stroke="rgba(234, 91, 12, 0.25)" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Center Cyber Badge: [ ? ] -->
  <g transform="translate(400, 240)">
    <!-- Outer Hex Shield -->
    <polygon points="0,-70 65,-35 65,35 0,70 -65,35 -65,-35" 
             fill="rgba(10, 13, 18, 0.92)" 
             stroke="url(#orangeNeon)" 
             stroke-width="2.5" 
             filter="url(#glowFilter)"/>

    <!-- Inner Hex Accents -->
    <polygon points="0,-58 54,-29 54,29 0,58 -54,29 -54,-29" 
             fill="none" 
             stroke="rgba(0, 229, 255, 0.35)" 
             stroke-width="1.2" 
             stroke-dasharray="6 3"/>

    <!-- The Glowing Question Mark -->
    <text x="0" y="22" 
          font-family="'Chakra Petch', 'Space Grotesk', sans-serif" 
          font-size="64" 
          font-weight="800" 
          fill="#FFFFFF" 
          text-anchor="middle"
          filter="url(#glowFilter)">?</text>
  </g>
</svg>
